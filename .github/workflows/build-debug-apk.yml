name: Build Android debug APK

on:
  push:
    branches:
      - main
      - perf/low-end-device-optimization
      - feat/unified-notes-whiteboard
      - feat/rich-notes-on-whiteboard
      - integration/rich-notes-main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate local debug signing key
        run: |
          keytool -genkeypair -v \\
            -keystore debug.keystore \\
            -storepass android \\
            -keypass android \\
            -alias androiddebugkey \\
            -keyalg RSA \\
            -keysize 2048 \\
            -validity 10000 \\
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
